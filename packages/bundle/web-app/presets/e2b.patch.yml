# Agent preset E2B : remote sandbox providers isolated in one group.
# Applied after the web patch; the session selects this preset via agent-preset.
- insert:
    - id: preset-e2b
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: e2b
        name: E2B Remote Sandbox
        description: Execute inside an isolated E2B sandbox with remote filesystem, subprocess, and sandbox lifecycle.
        order: 10
        plugins:
          # E2B lifecycle owner (isolated group).
          - id: e2b-group
            name: cordis:group
            group: true
            isolate:
              workspace: true
            config:
              - id: e2b
                name: '@deepseek-ai/dsh-e2b'
                config:
                  workspace: '/home/user'
                  # apiKey arrives from the session settings card, never from the preset.
              - id: fs-e2b
                name: '@deepseek-ai/dsh-fs-e2b'
              - id: subprocess-e2b
                name: '@deepseek-ai/dsh-subprocess-e2b'
              - id: bash-local
                name: '@deepseek-ai/dsh-bash-local'
              - id: terminal-bash
                name: '@deepseek-ai/dsh-terminal-bash'
              - id: sandbox-policy
                name: '@deepseek-ai/dsh-sandbox-policy'
              - id: sandbox-local
                name: '@deepseek-ai/dsh-sandbox-local'
